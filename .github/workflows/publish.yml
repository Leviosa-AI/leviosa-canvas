name: publish

# @leviosa-ai/canvas 를 공개 npm에 올린다. 버전 태그를 밀면 돈다.
#   git tag canvas-v0.1.0 && git push origin canvas-v0.1.0
#
# 인증은 **Trusted Publishing(OIDC)** 이다 — 저장소에 NPM_TOKEN 시크릿이 없다.
# 발행 때마다 GitHub이 발급하는 단명 토큰으로 npm에 붙는다.
#
# 소비자에게는 아무 영향이 없다. 설치는 그대로 `npm i @leviosa-ai/canvas` 이고,
# leviosa-konva 때 팀원들을 막았던 것은 *설치* 인증(사설 레지스트리)이지 *발행*
# 인증이 아니었다.
#
# 붙이는 순서(한 번만):
#   1. `NPM_CANVAS_TOKEN`으로 손으로 한 번 발행한다 — 패키지가 있어야 발행자를 등록할 수 있다.
#   2. npmjs.com > 패키지 > Settings > Trusted publisher 에 Leviosa-AI/leviosa-canvas · publish.yml 등록.
#   3. 그 뒤로 이 워크플로가 시크릿 없이 돈다.
on:
  push:
    tags:
      - "canvas-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC. 이게 없으면 트러스티드 퍼블리싱이 안 붙는다.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          scope: "@leviosa-ai"

      # 러너 기본 npm이 11.5.1보다 낮으면 OIDC를 모른다.
      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # package.json 버전과 밀린 태그가 다르면 여기서 시끄럽게 죽는다.
      - name: Verify tag matches package version
        run: |
          PKG=$(node -p "require('./packages/canvas/package.json').version")
          TAG=${GITHUB_REF_NAME#canvas-v}
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::packages/canvas/package.json version ($PKG) != tag ($TAG)"; exit 1
          fi

      - run: npm publish --workspace packages/canvas
