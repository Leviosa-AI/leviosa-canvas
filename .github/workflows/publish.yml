name: publish

# 이 저장소의 패키지를 공개 npm에 올린다. 버전 태그를 밀면 돈다.
#   git tag canvas-v0.1.0             && git push origin canvas-v0.1.0
#   git tag detail-page-editor-v0.1.0 && git push origin detail-page-editor-v0.1.0
#
# 태그 접두어가 곧 `packages/` 아래 폴더 이름이다. 패키지가 늘어도 여기 손댈 일이
# 없도록 접두어에서 폴더를 뽑는다 — 이름을 두 군데 적으면 언젠가 갈라진다.
#
# 인증은 **Trusted Publishing(OIDC)** 이다 — 저장소에 NPM_TOKEN 시크릿이 없다.
# 발행 때마다 GitHub이 발급하는 단명 토큰으로 npm에 붙는다.
#
# 소비자에게는 아무 영향이 없다. 설치는 그대로 `npm i @leviosa-ai/canvas` 이고,
# leviosa-konva 때 팀원들을 막았던 것은 *설치* 인증(사설 레지스트리)이지 *발행*
# 인증이 아니었다.
#
# 붙이는 순서(한 번만):
#   1. `NPM_CANVAS_TOKEN`으로 손으로 한 번 발행한다 — 패키지가 있어야 발행자를 등록할 수 있다.
#   2. npmjs.com > 패키지 > Settings > Trusted publisher 에 Leviosa-AI/leviosa-canvas · publish.yml 등록.
#   3. 그 뒤로 이 워크플로가 시크릿 없이 돈다.
on:
  push:
    tags:
      - "canvas-v*"
      - "detail-page-editor-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC. 이게 없으면 트러스티드 퍼블리싱이 안 붙는다.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          scope: "@leviosa-ai"

      # 러너 기본 npm이 11.5.1보다 낮으면 OIDC를 모른다.
      #
      # @latest 가 아니라 11.x 로 못 박은 이유: npm 12는 의존성의 install 스크립트를
      # 기본으로 **막는다**. 그러면 `canvas`(node-gyp)가 안 서고, jsdom이 2D 컨텍스트
      # 없이 뜨고, Konva가 글자를 재다가 죽는다 — 실제로 canvas-v0.1.1 첫 시도가
      # 여기서 깨졌다. ci.yml 은 러너 기본 npm(11.x)을 그대로 쓰므로 초록이었다.
      # 러너 기본이 12로 올라가면 그때는 allowScripts 를 선언해야 한다.
      - run: npm install -g "npm@^11.5.1"

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # 태그에서 패키지와 버전을 뽑는다. `<폴더>-v<버전>` 이 규칙이고,
      # package.json 버전과 다르면 여기서 시끄럽게 죽는다.
      - name: Resolve package from tag
        id: target
        run: |
          NAME=${GITHUB_REF_NAME%-v*}
          TAG=${GITHUB_REF_NAME##*-v}
          DIR="packages/$NAME"
          if [ ! -f "$DIR/package.json" ]; then
            echo "::error::$DIR/package.json 이 없다 (태그 $GITHUB_REF_NAME)"; exit 1
          fi
          PKG=$(node -p "require('./$DIR/package.json').version")
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::$DIR/package.json version ($PKG) != tag ($TAG)"; exit 1
          fi
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - run: npm publish --workspace ${{ steps.target.outputs.dir }}
