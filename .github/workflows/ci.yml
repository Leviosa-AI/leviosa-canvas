name: ci

on:
  push:
    branches: [main]
  pull_request:

# 이 워크플로는 읽기만 한다. 안 적으면 저장소 설정의 기본값을 그대로 받는데,
# 그건 쓰기까지 열려 있을 수 있다 — 발행은 `publish.yml` 이 따로 한다.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test
