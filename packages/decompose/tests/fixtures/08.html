<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { background:#fff; }
  .plate {
    position:relative; width:1080px; height:1350px; overflow:hidden;
    background:#F2DACD;
    font-family:'Pretendard','Apple SD Gothic Neo',sans-serif;
  }
  .shot { position:absolute; left:0; top:0; width:1080px; height:860px; overflow:hidden; }
  .shot img { width:100%; height:100%; object-fit:cover; object-position:50% 28%; }
  .shot .wash {
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(250,238,230,.22) 0%, rgba(250,238,230,0) 30%, rgba(242,218,205,.50) 100%);
  }

  .band {
    position:absolute; left:0; bottom:0; width:1080px; height:490px;
    background:linear-gradient(180deg, #F2DACD 0%, #E9C7B6 100%);
  }
  .headline {
    position:absolute; left:73px; top:952px; right:73px;
    font-size:58px; font-weight:800; line-height:1.34; letter-spacing:-.03em; color:#4A3330;
  }
  .headline em { font-style:normal; color:#C4553C; }
  .sub {
    position:absolute; left:75px; top:1132px;
    font-family:'Jost',sans-serif; font-weight:500; font-size:28px;
    letter-spacing:.13em; color:#8A6152;
  }
  .logo {
    position:absolute; right:70px; bottom:50px;
    font-family:'Jost',sans-serif; font-weight:300; font-size:50px;
    letter-spacing:.01em; color:#4A3330;
  }

  .badge { position:absolute; left:790px; top:672px; width:176px; height:176px; }
  .badge svg { position:absolute; inset:0; }
  .badge-t {
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:4px;
    font-size:42px; font-weight:800; line-height:1.08; color:#fff;
  }
  .badge-t small { font-size:30px; font-weight:700; letter-spacing:.02em; }
</style>
</head>
<body>
<div class="plate" data-role="closer" data-skeleton="photo-band">
  <div class="shot">
    <img data-block="photo" src="/Users/leviosaai/leviosa/scratchpad/harness/photos/shoot_tint/tint_model_a.png" alt="">
    <div class="wash"></div>
  </div>

  <div class="band"></div>

  <div class="badge">
    <svg width="176" height="176" viewBox="0 0 176 176" xmlns="http://www.w3.org/2000/svg">
      <circle cx="88" cy="88" r="88" fill="#2FD35B"/>
    </svg>
    <div class="badge-t" data-block="text">8/15<small>오픈</small></div>
  </div>

  <div class="headline" data-block="text"><em>8월 15일</em><br>올리브영 단독 출시</div>
  <div class="sub" data-block="text">MELTING BLUR TINT · 6 COLORS</div>
  <div class="logo" data-block="text">dasique</div>
</div>
</body>
</html>
