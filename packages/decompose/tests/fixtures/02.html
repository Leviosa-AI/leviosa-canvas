<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { background:#fff; }
  .plate {
    position:relative; width:1080px; height:1350px; overflow:hidden;
    background:#F6E3DA;
    font-family:'Pretendard','Apple SD Gothic Neo',sans-serif;
  }
  .shot { position:absolute; left:0; top:0; width:1080px; height:976px; overflow:hidden; }
  .shot img { width:100%; height:100%; object-fit:cover; }
  .shot .wash {
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(246,222,211,.42) 0%, rgba(246,222,211,0) 34%);
  }

  .brand-r {
    position:absolute; right:70px; top:32px;
    font-family:'Jost',sans-serif; font-weight:300; font-size:44px;
    letter-spacing:.01em; color:#4A3330;
  }
  .kicker {
    position:absolute; left:73px; top:44px;
    font-size:29px; font-weight:800; letter-spacing:.055em; color:#5A4038;
  }

  .band {
    position:absolute; left:0; bottom:0; width:1080px; height:374px;
    background:linear-gradient(180deg, #F2DACD 0%, #EBCBBB 100%);
  }
  .row { position:absolute; left:52px; right:52px; top:74px; display:flex; }
  .cell { flex:1; position:relative; height:230px; }
  .cell svg { position:absolute; left:50%; top:0; transform:translateX(-50%); }
  .cell .lab {
    position:absolute; left:0; right:0; top:150px; text-align:center;
    font-family:'Jost',sans-serif; font-weight:600; font-size:32px;
    letter-spacing:.03em; color:#5A4038;
  }
  .cell .nm {
    position:absolute; left:0; right:0; top:190px; text-align:center;
    font-size:23px; font-weight:500; line-height:1.25; color:#7A5B4E;
    letter-spacing:-.01em;
  }
</style>
</head>
<body>
<div class="plate" data-role="body" data-skeleton="photo-band">
  <div class="shot">
    <img data-block="photo" src="/Users/leviosaai/leviosa/scratchpad/harness/photos/shoot_tint/tint_row.png" alt="">

  <div class="kicker" data-block="text">FULL LINE UP</div>

    <div class="row">
      <div class="cell">

      </div>
    </div>
  </div>
</div>
</body>
</html>
