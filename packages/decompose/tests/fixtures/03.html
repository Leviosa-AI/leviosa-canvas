<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { background:#fff; }
  .plate {
    position:relative; width:1080px; height:1350px; overflow:hidden;
    background:#EAD3C6;
    font-family:'Pretendard','Apple SD Gothic Neo',sans-serif;
  }
  .grid {
    position:absolute; inset:0; display:grid;
    grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr 1fr; gap:6px;
  }
  .cell { position:relative; overflow:hidden; background:#FAEDE4; }
  .cell.alt { background:#F5E2D5; }
  .cell svg { position:absolute; left:0; top:0; }
  .cap {
    position:absolute; right:26px; bottom:22px; text-align:right;
    font-size:27px; font-weight:500; letter-spacing:-.01em; color:#4A3330;
  }
  .cap b { font-family:'Jost',sans-serif; font-weight:600; letter-spacing:.03em; }
</style>
</head>
