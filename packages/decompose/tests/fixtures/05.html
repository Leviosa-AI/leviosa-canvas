<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { background:#fff; }
  .plate {
    position:relative; width:1080px; height:1350px; overflow:hidden;
    background:#F3E0D4;
    font-family:'Pretendard','Apple SD Gothic Neo',sans-serif;
  }
  .bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .wash {
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(58,30,24,.42) 0%, rgba(58,30,24,.06) 34%, rgba(58,30,24,0) 60%);
  }
  .head { position:absolute; left:73px; top:66px; right:73px; }
  .kick {
    font-family:'Jost',sans-serif; font-weight:600; font-size:28px;
    letter-spacing:.14em; color:#FFD9CB; margin-bottom:18px;
  }
  .line {
    font-size:58px; font-weight:700; line-height:1.34; letter-spacing:-.02em; color:#FFF4EE;
  }
  .line em { font-style:normal; color:#FFC0AC; }
  .cap {
    position:absolute; right:44px; bottom:38px; text-align:right;
    font-size:27px; font-weight:500; letter-spacing:-.01em; color:#FFF0E8;
  }
  .cap b { font-family:'Jost',sans-serif; font-weight:600; letter-spacing:.04em; }
</style>
</head>
<body>
<div class="plate" data-role="body" data-skeleton="photo-caption">
  <img class="bg" data-block="photo" src="/Users/leviosaai/leviosa/scratchpad/harness/photos/shoot_tint/tint_lip_matte.png" alt="">
  <div class="wash"></div>

  <div class="head">
    <div class="kick" data-block="text">BLUR FINISH</div>
    <div class="line" data-block="text">얇게 한 번,<br><em>물빠진 듯</em> 매트하게</div>
  </div>

  <div class="cap" data-block="text"><b>DEEP</b> 딥 컬러 한 겹</div>
</div>
</body>
</html>
